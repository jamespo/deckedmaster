version: 2

env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
builds:
  - id: deckedmaster
    binary: deckedmaster
    flags:
      - -trimpath
    ldflags: -s -w -X main.Version={{ .Version }} -X main.CommitSHA={{ .Commit }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - 386
      - arm
    goarm:
      - 6
      - 7

archives:
  # Keeps the pre-v2 artifact names, which used to be produced by the removed
  # `replacements` option.
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

nfpms:
  - ids:
      - deckedmaster
    vendor: jamespo
    homepage: "https://github.com/jamespo/deckedmaster"
    maintainer: "James Powell <jamespo@gmail.com>"
    description: "An application to control your Elgato Stream Deck or Ajazz AKP03E"
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin

